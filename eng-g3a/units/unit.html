<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title">Unit · 互动学习</title>
<link rel="stylesheet" href="../style.css">
<style>
/* ===== Section 块（每段：教材图 + 音频 + 主题词）===== */
.section-block {
  background: var(--white);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.section-block h3 {
  display: flex; align-items: center; gap: 10px;
  color: var(--primary-dark);
  font-size: 1.25rem;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.section-block h3 .page-tag {
  font-size: 0.7rem; background: var(--primary); color: white;
  padding: 3px 10px; border-radius: 8px; font-weight: 700;
}
.section-block h3 .section-icon {
  font-size: 1.4rem;
}
.section-block .desc {
  color: var(--text-soft); font-size: 0.9rem;
  margin-bottom: 12px; line-height: 1.5;
}
.audio-bar {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg); border-radius: 10px; padding: 10px 14px;
  margin-bottom: 14px;
}
.audio-bar .play-btn {
  background: var(--primary); color: white; border: none;
  width: 38px; height: 38px; border-radius: 50%; font-size: 1rem;
  cursor: pointer; flex-shrink: 0;
  transition: transform 0.1s;
}
.audio-bar .play-btn:hover { transform: scale(1.05); }
.audio-bar .play-btn.playing { background: #dc3545; }
.audio-bar .audio-info { flex: 1; min-width: 0; }
.audio-bar .audio-title { font-weight: 600; font-size: 0.9rem; }
.audio-bar .audio-progress {
  background: #e6eaf0; height: 4px; border-radius: 2px;
  margin: 6px 0; overflow: hidden;
}
.audio-bar .audio-progress-fill {
  background: var(--primary); height: 100%; width: 0%; transition: width 0.2s;
}
.audio-bar .audio-time { font-size: 0.78rem; color: var(--text-soft); }

/* 教材整页图（按 pages 数组展示 1-2 张） */
.textbook-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px; margin-bottom: 14px;
}
.textbook-img {
  width: 100%; border-radius: 10px; border: 2px solid var(--bg);
  cursor: pointer; transition: transform 0.15s;
  background: #f8f9fa;
}
.textbook-img:hover { transform: scale(1.02); }
.textbook-page-tag {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,0.6); color: white;
  font-size: 0.7rem; padding: 2px 8px; border-radius: 6px;
  font-weight: 600;
}
.textbook-card { position: relative; }

/* 主题词卡（仅 topic_words 段展示） */
.word-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
  margin-top: 6px;
}
.word-chip {
  background: var(--bg); border-radius: 10px; padding: 10px 6px;
  text-align: center; font-weight: 600; font-size: 0.95rem;
  cursor: pointer; transition: all 0.15s;
  border: 2px solid transparent;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.word-chip:hover { background: white; border-color: var(--primary); transform: translateY(-1px); }
.word-chip img.word-img {
  width: 60px; height: 60px; object-fit: contain;
  border-radius: 6px; background: white;
  margin-bottom: 4px;
}
.word-chip .word-en { font-size: 0.95rem; line-height: 1.1; }
.word-chip .word-play {
  display: inline-block; font-size: 0.7rem;
  background: var(--primary); color: white;
  padding: 2px 8px; border-radius: 6px;
  margin-top: 2px;
}

/* 3 阶段切换 */
.stage-tabs { display: flex; gap: 8px; margin: 0 0 20px 0; flex-wrap: wrap; }
.stage-tab {
  background: var(--white); border: none; padding: 10px 18px;
  font-size: 0.9rem; font-weight: 700; color: var(--text-soft);
  cursor: pointer; border-radius: 12px;
  transition: all 0.15s; box-shadow: var(--shadow);
}
.stage-tab:hover { background: var(--bg); }
.stage-tab.active { background: var(--primary); color: white; }
.stage { display: none; }
.stage.active { display: block; }

/* Modal */
.textbook-modal { display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 200;
  align-items: center; justify-content: center; padding: 20px; }
.textbook-modal.active { display: flex; }
.textbook-modal img { max-width: 100%; max-height: 100%; border-radius: 8px; }

/* Breadcrumb */
.breadcrumb { background: var(--white); padding: 10px 20px; font-size: 0.85rem; color: var(--text-soft); border-bottom: 1px solid #e6eaf0; }
.breadcrumb a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { margin: 0 6px; opacity: 0.5; }
.breadcrumb span:last-child { color: var(--text); font-weight: 600; }

/* 闪卡 + 游戏 */
.flashcard {
  background: var(--white); border-radius: 14px; padding: 30px;
  box-shadow: var(--shadow); text-align: center; max-width: 420px;
  margin: 0 auto;
}
.flashcard .fc-en { font-size: 2.2rem; font-weight: 700; margin-bottom: 6px; }
.flashcard .fc-zh { font-size: 1.1rem; color: var(--text-soft); margin-bottom: 14px; min-height: 1.4em; }
.flashcard .fc-img { max-height: 140px; border-radius: 12px; margin-bottom: 12px; }
.flashcard .fc-meta { font-size: 0.85rem; color: var(--text-soft); }
.flashcard-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.game-board {
  background: var(--white); border-radius: 14px; padding: 24px;
  box-shadow: var(--shadow); text-align: center; max-width: 480px; margin: 0 auto;
}
.game-icon { font-size: 3rem; margin: 10px 0; cursor: pointer; }
.game-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: 16px auto 0; }
.game-option {
  background: var(--bg); border: 2px solid transparent; padding: 12px;
  border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 600;
  transition: all 0.1s;
}
.game-option:hover { background: white; border-color: var(--primary); }
.game-option.correct { background: #d4edda !important; border-color: #28a745 !important; }
.game-option.wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
</style>
</head>
<body>

<nav class="breadcrumb">
  <a href="../../index.html">📚 学习中心</a>
  <span class="sep">/</span>
  <a href="../../index.html#english">英语 English</a>
  <span class="sep">/</span>
  <a id="bc-grade" href="../index.html">年级</a>
  <span class="sep">/</span>
  <span id="bc-unit">UNIT</span>
</nav>

<header class="unit-header">
  <a class="back" href="../index.html">← 返回选单元</a>
  <h1 id="unit-title">Unit</h1>
  <p class="sub" id="unit-sub">⏱ ...</p>
</header>

<nav class="stage-tabs">
  <button class="stage-tab active" data-stage="preview">👀 预习</button>
  <button class="stage-tab" data-stage="review">🔄 复习</button>
  <button class="stage-tab" data-stage="play">🎮 游戏</button>
</nav>

<!-- 阶段 1: 预习 - 按 section 段展示 -->
<section class="stage active" id="stage-preview">
  <h2 style="margin-bottom: 16px;">👀 预习：按 section 段精修（PDF 教材图 + 配套音频 + 主题词）</h2>
  <div id="sections-container"></div>
</section>

<!-- 阶段 2: 复习 - 闪卡 -->
<section class="stage" id="stage-review">
  <h2 style="margin-bottom: 16px;">🔄 复习：主题词闪卡</h2>
  <div class="flashcard" id="flashcard">
    <img id="fc-img" class="fc-img" style="display:none;" />
    <div class="fc-en" id="fc-en">—</div>
    <div class="fc-zh" id="fc-zh">—</div>
    <div class="fc-meta" id="fc-meta">点击翻面看意思</div>
    <div class="flashcard-btns">
      <button class="btn btn-soft" id="fc-prev">← 上一个</button>
      <button class="btn btn-primary" id="fc-flip">翻面看图</button>
      <button class="btn btn-soft" id="fc-sound">🔊 听</button>
      <button class="btn btn-soft" id="fc-next">下一个 →</button>
    </div>
  </div>
  <div style="text-align: center; margin-top: 16px;">
    <button class="btn btn-accent" id="fc-shuffle">🔀 乱序复习</button>
  </div>
</section>

<!-- 阶段 3: 游戏 - 听音选词 -->
<section class="stage" id="stage-play">
  <h2 style="margin-bottom: 16px;">🎮 游戏：听教材原声选单词</h2>
  <div class="game-board">
    <div id="game-icon" class="game-icon">🔊</div>
    <div id="game-prompt" style="font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;">点击开始</div>
    <div id="game-options" class="game-options"></div>
    <div style="margin-top: 16px; font-size: 0.95rem; color: var(--text-soft);">
      答对 <span id="game-correct" style="color: #28a745; font-weight: 700;">0</span> ·
      答错 <span id="game-wrong" style="color: #dc3545; font-weight: 700;">0</span>
    </div>
    <div style="margin-top: 16px;">
      <button class="btn btn-accent" id="game-start">🎮 开始游戏</button>
    </div>
  </div>
</section>

<div class="textbook-modal" id="modal" onclick="closeModal()">
  <img id="modal-img" src="" />
</div>

<script src="sections_data.js"></script>
<script>
// ===== 从 query string 取 unit id =====
const params = new URLSearchParams(location.search);
const uid = params.get('u') || 'unit1';
const UNIT = SECTIONS_DATA[uid];
if (!UNIT) {
  document.body.innerHTML = `<h1 style="padding:40px">未找到单元 ${uid}</h1>`;
  throw new Error('unit not found');
}

const GRADE = (location.pathname.includes('eng-g3a')) ? 'G3A' : 'G5A';
const GRADE_FULL = (GRADE === 'G3A') ? '三年级上册' : '五年级上册';
document.title = `${UNIT.num || uid} · ${UNIT.name} · 互动学习`;
document.getElementById('unit-title').textContent = `${UNIT.num || uid} · ${UNIT.name}`;
document.getElementById('unit-sub').textContent =
  `${UNIT.description || ''}${UNIT.description ? ' · ' : ''}⏱ ${UNIT.duration || '...'}`;
document.getElementById('bc-grade').textContent = GRADE_FULL;
document.getElementById('bc-unit').textContent = UNIT.num || uid;

// ===== 渲染 sections =====
const container = document.getElementById('sections-container');
const sectionAudios = {};

UNIT.sections.forEach((sec, idx) => {
  const block = document.createElement('div');
  block.className = 'section-block';
  block.dataset.sectionId = sec.id;

  // section 标题 + 页码标签
  const pageRange = sec.pages.length === 1
    ? `p.${sec.pages[0]}`
    : `p.${sec.pages[0]}-${sec.pages[sec.pages.length-1]}`;
  const h3 = `<h3>
    <span class="section-icon">${sec.icon}</span>
    ${sec.name} <span style="font-size:0.85rem; color:var(--text-soft);">${sec.id}</span>
    <span class="page-tag">PDF ${pageRange}</span>
  </h3>`;

  // 描述
  let desc = '';
  if (sec.id === 'topic_words' && UNIT.sections.find(s => s.id === 'big_task')) {
    const bt = UNIT.sections.find(s => s.id === 'big_task');
    desc = `<p class="desc">本单元主题词 · 大任务: <b>${UNIT.sections.find(s=>s.id==='topic_words').big_task || '—'}</b></p>`;
  }

  // 音频条
  const audioPath = sec.audio;
  const isWholeUnit = (audioPath === UNIT.audio_file);
  const audioLabel = isWholeUnit
    ? `📖 教材原声 (整段 ${UNIT.duration || ''})`
    : `📖 配套音频 (${sec.name})`;
  const audioBar = `
    <div class="audio-bar">
      <button class="play-btn" data-section-idx="${idx}">▶</button>
      <div class="audio-info">
        <div class="audio-title">${audioLabel}</div>
        <div class="audio-progress"><div class="audio-progress-fill" data-fill="${idx}"></div></div>
        <div class="audio-time">
          <span data-cur="${idx}">0:00</span> / <span data-dur="${idx}">...</span>
        </div>
      </div>
    </div>`;

  // 教材整页图（按 pages 数组）
  const pagesHTML = sec.pages.map(p => `
    <div class="textbook-card">
      <img class="textbook-img" src="../assets/img/page${String(p).padStart(3,'0')}.jpg"
        alt="PDF p.${p}" onclick="openModal(${p})"
        onerror="this.parentElement.style.display='none'" />
      <div class="textbook-page-tag">p.${p}</div>
    </div>
  `).join('');
  const textbookHTML = `<div class="textbook-grid">${pagesHTML}</div>`;

  // 主题词卡（仅 topic_words 段）
  let wordsHTML = '';
  if (sec.id === 'topic_words' && sec.words && sec.words.length > 0) {
    const wordsList = sec.words.map(w => {
      const en = typeof w === 'string' ? w : w.en;
      const zh = typeof w === 'string' ? '' : (w.zh || '');
      const safe = en.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
      return `<div class="word-chip" data-word="${en}" data-safe="${safe}">
        <img class="word-img" src="../assets/img/${uid}/${safe}.jpg"
          alt="${en}" onerror="this.style.display='none'" />
        <span class="word-en">${en}</span>
        <span class="word-play" onclick="event.stopPropagation(); playWordAudio('${en}', '${uid}')">🔊</span>
      </div>`;
    }).join('');
    wordsHTML = `<div class="word-grid">${wordsList}</div>`;
  }

  block.innerHTML = h3 + desc + audioBar + textbookHTML + wordsHTML;
  container.appendChild(block);

  // 初始化此段音频
  const audio = new Audio('../assets/audio/' + audioPath);
  audio.preload = 'metadata';
  sectionAudios[idx] = { audio, btn: block.querySelector('.play-btn'), fill: block.querySelector(`[data-fill="${idx}"]`), cur: block.querySelector(`[data-cur="${idx}"]`), dur: block.querySelector(`[data-dur="${idx}"]`) };
});

// ===== 音频播放控制 =====
Object.entries(sectionAudios).forEach(([idx, a]) => {
  a.btn.addEventListener('click', () => {
    // 暂停其他音频
    Object.entries(sectionAudios).forEach(([i2, a2]) => {
      if (i2 !== idx && !a2.audio.paused) {
        a2.audio.pause();
        a2.btn.textContent = '▶';
        a2.btn.classList.remove('playing');
      }
    });
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (a.audio.paused) {
      a.audio.play().catch(e => console.error('播放失败', e));
      a.btn.textContent = '⏸';
      a.btn.classList.add('playing');
    } else {
      a.audio.pause();
      a.btn.textContent = '▶';
      a.btn.classList.remove('playing');
    }
  });
  a.audio.addEventListener('timeupdate', () => {
    if (a.audio.duration) {
      a.fill.style.width = ((a.audio.currentTime / a.audio.duration) * 100) + '%';
      a.cur.textContent = fmt(a.audio.currentTime);
    }
  });
  a.audio.addEventListener('loadedmetadata', () => {
    a.dur.textContent = fmt(a.audio.duration);
  });
  a.audio.addEventListener('ended', () => {
    a.btn.textContent = '▶';
    a.btn.classList.remove('playing');
  });
});

// 单词 mp3 播放
function playWordAudio(word, unitId) {
  const safe = word.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
  const path = `../assets/audio/${unitId}/words/${safe}.mp3`;
  const audio = new Audio(path);
  audio.play().catch(() => {
    // 降级到 TTS
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US'; u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
  });
}

// TTS 单词（点 chip 朗读）
let englishVoice = null;
function loadVoice() {
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  englishVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
}
if (window.speechSynthesis) {
  loadVoice();
  window.speechSynthesis.onvoiceschanged = loadVoice;
}
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (englishVoice) u.voice = englishVoice;
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

// 单词 chip 点击 → TTS
container.addEventListener('click', e => {
  const chip = e.target.closest('.word-chip');
  if (chip) speak(chip.dataset.word);
});

function fmt(s) { s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function openModal(p) {
  document.getElementById('modal-img').src = '../assets/img/page' + String(p).padStart(3,'0') + '.jpg';
  document.getElementById('modal').classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }

// 阶段切换
document.querySelectorAll('.stage-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.stage-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('stage-' + tab.dataset.stage).classList.add('active');
    Object.values(sectionAudios).forEach(a => { a.audio.pause(); a.btn.textContent = '▶'; a.btn.classList.remove('playing'); });
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  });
});

// ===== 闪卡 (汇总所有 topic_words) =====
const FC_WORDS = [];
UNIT.sections.forEach(sec => {
  if (sec.id === 'topic_words' && sec.words) {
    sec.words.forEach(w => {
      const en = typeof w === 'string' ? w : w.en;
      const zh = typeof w === 'string' ? '' : (w.zh || '');
      FC_WORDS.push({ en, zh, safe: en.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() });
    });
  }
});
let fcIdx = 0, fcFlipped = false, fcOrder = FC_WORDS.map((_, i) => i);
function renderFC() {
  if (FC_WORDS.length === 0) {
    document.getElementById('fc-en').textContent = '本单元无主题词';
    return;
  }
  const w = FC_WORDS[fcOrder[fcIdx]];
  document.getElementById('fc-en').textContent = w.en;
  document.getElementById('fc-zh').textContent = w.zh || '—';
  document.getElementById('fc-zh').style.display = fcFlipped ? 'block' : 'none';
  const img = document.getElementById('fc-img');
  img.src = `../assets/img/${uid}/${w.safe}.jpg`;
  img.onload = () => { img.style.display = fcFlipped ? 'inline-block' : 'none'; };
  img.onerror = () => { img.style.display = 'none'; };
  document.getElementById('fc-meta').textContent = `${fcIdx+1} / ${FC_WORDS.length}`;
}
document.getElementById('fc-prev').onclick = () => { fcIdx = (fcIdx-1+fcOrder.length)%fcOrder.length; fcFlipped = false; renderFC(); };
document.getElementById('fc-next').onclick = () => { fcIdx = (fcIdx+1)%fcOrder.length; fcFlipped = false; renderFC(); };
document.getElementById('fc-flip').onclick = () => { fcFlipped = !fcFlipped; renderFC(); };
document.getElementById('fc-sound').onclick = () => speak(FC_WORDS[fcOrder[fcIdx]].en);
document.getElementById('fc-shuffle').onclick = () => { fcOrder = [...fcOrder].sort(() => Math.random()-0.5); fcIdx = 0; fcFlipped = false; renderFC(); };
renderFC();

// ===== 游戏: 听音选词 =====
let gameCorrect = 0, gameWrong = 0, gameAnswered = false, gameCurrent = null;
function nextRound() {
  if (FC_WORDS.length < 2) {
    document.getElementById('game-prompt').textContent = '主题词少于 2 个，无法游戏';
    return;
  }
  const correctIdx = Math.floor(Math.random() * FC_WORDS.length);
  gameCurrent = FC_WORDS[correctIdx];
  const distractors = [];
  while (distractors.length < 3) {
    const d = FC_WORDS[Math.floor(Math.random() * FC_WORDS.length)];
    if (d.en !== gameCurrent.en && !distractors.find(x => x.en === d.en)) distractors.push(d);
  }
  const options = [gameCurrent, ...distractors].sort(() => Math.random()-0.5);
  document.getElementById('game-prompt').textContent = `听: 选单词 "${gameCurrent.en}"`;
  const gameOpts = document.getElementById('game-options');
  gameOpts.innerHTML = options.map(o => `<button class="game-option" data-en="${o.en}">${o.en}</button>`).join('');
  gameAnswered = false;
  document.getElementById('game-icon').onclick = () => speak(gameCurrent.en);
  gameOpts.querySelectorAll('.game-option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (gameAnswered) return;
      gameAnswered = true;
      if (btn.dataset.en === gameCurrent.en) {
        btn.classList.add('correct');
        gameCorrect++;
        document.getElementById('game-correct').textContent = gameCorrect;
        document.getElementById('game-prompt').textContent = '🎉 答对!';
      } else {
        btn.classList.add('wrong');
        gameOpts.querySelectorAll('.game-option').forEach(b => {
          if (b.dataset.en === gameCurrent.en) b.classList.add('correct');
        });
        gameWrong++;
        document.getElementById('game-wrong').textContent = gameWrong;
        document.getElementById('game-prompt').textContent = `😅 正确: ${gameCurrent.en}`;
      }
      setTimeout(nextRound, 1500);
    });
  });
  setTimeout(() => speak(gameCurrent.en), 400);
}
document.getElementById('game-start').onclick = () => { gameCorrect = 0; gameWrong = 0; document.getElementById('game-correct').textContent = '0'; document.getElementById('game-wrong').textContent = '0'; nextRound(); };
</script>
</body>
</html>
